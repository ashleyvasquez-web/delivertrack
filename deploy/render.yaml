# Ejemplo de despliegue en Render (nube) con base de datos PostgreSQL gestionada.
# La capa gratuita sirve para la demostración académica.
services:
  - type: web
    name: delivertrack-api
    runtime: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: delivertrack-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://delivertrack-frontend.onrender.com
      - key: EVALUAR_RIESGO_AL_CONSULTAR
        value: "1"

databases:
  - name: delivertrack-db
    databaseName: delivertrack
    plan: free
