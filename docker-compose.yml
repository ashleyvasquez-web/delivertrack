# Compose opcional para ejecutar DeliverTrack con PostgreSQL
# (como se haría en producción en la nube).
#
#   docker compose up --build
#
# Requiere Docker Desktop o Docker Engine.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: delivertrack
      POSTGRES_USER: delivertrack
      POSTGRES_PASSWORD: cambiar-esta-clave
    volumes:
      - datos_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delivertrack"]
      interval: 5s
      retries: 5

  api:
    build: ./backend
    environment:
      DJANGO_SECRET_KEY: cambiar-esta-clave
      DEBUG: "0"
      DATABASE_URL: postgres://delivertrack:cambiar-esta-clave@db:5432/delivertrack
      ALLOWED_HOSTS: "*"
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_demo &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2"
    ports:
      - "8000:8000"

volumes:
  datos_pg:
